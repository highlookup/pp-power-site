name: 站点数据每日更新

on:
  schedule:
    # GitHub 免费版 schedule 为 best-effort：实测延迟 3~9 小时，甚至整日跳过（11-20 全天未触发）。
    # 对策不是赌单次准点，而是当日铺满多个时段：任意一次跑成功即完成，其余靠幂等秒退。
    # 全部使用冷门分钟数，避开整点/半点的全局调度拥堵高峰。
    # 以下为 UTC，对应北京时间：
    #   08:37 -> 16:37   10:19 -> 18:19   11:53 -> 19:53
    #   13:31 -> 21:31   14:47 -> 22:47   15:53 -> 23:53
    - cron: '37 8 * * *'
    - cron: '19 10 * * *'
    - cron: '53 11 * * *'
    - cron: '31 13 * * *'
    - cron: '47 14 * * *'
    - cron: '53 15 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [daily-update]

permissions:
  contents: write

concurrency:
  group: site-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成站点数据与页面
        run: python build_site.py

      - name: 判断是否有实质变化
        id: check
        run: |
          git show HEAD:data.json > /tmp/remote.json || cp data.json /tmp/remote.json
          git show HEAD:index.html > /tmp/remote.html || cp index.html /tmp/remote.html
          changed=false
          if python check_data.py /tmp/remote.json data.json; then
            echo "数据实质内容一致"
          else
            echo "数据实质内容有变化"
            changed=true
          fi
          # 页面自洽性：已提交的 index.html 内嵌时间戳必须与已提交的 data.json 一致。
          # 防止「data.json 已推送但 index.html 未推送」导致页面长期停留旧版本（11-24 事故）。
          if python check_page.py /tmp/remote.html /tmp/remote.json; then
            echo "页面自洽"
          else
            echo "页面掉队，需要重新提交"
            changed=true
          fi
          # 收盘窗口：北京时间 15:30 前数据源的「当月K线」还是盘中价，
          # 此时绝不能提交（11-24 上午曾把盘中价 3569.23 写成当日收盘）。
          if [ "$changed" = "true" ]; then
            if python check_window.py; then
              echo "已过收盘窗口，可以提交"
            else
              echo "未到收盘窗口，本次不提交（等待后续触发）"
              changed=false
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: 提交更新
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "每日数据更新 $(TZ=Asia/Shanghai date '+%Y-%m-%d')"
            git push
          fi

      - name: 无变化说明
        if: steps.check.outputs.changed != 'true'
        run: echo "数据与线上一致，跳过提交（幂等）"