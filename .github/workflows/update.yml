name: 站点数据每日更新

on:
  schedule:
    # GitHub 免费版 schedule 为 best-effort，整点/半点（0 分、30 分）是全局拥堵高峰，
    # 实测延迟 3~9 小时甚至整日跳过。故全部改用冷门分钟数，并在一天内分散多个时段。
    # 以下为 UTC，对应北京时间：
    #   08:07 -> 16:07   09:23 -> 17:23   11:11 -> 19:11
    #   13:37 -> 21:37   15:49 -> 23:49
    - cron: '7 8 * * *'
    - cron: '23 9 * * *'
    - cron: '11 11 * * *'
    - cron: '37 13 * * *'
    - cron: '49 15 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [daily-update]

permissions:
  contents: write

concurrency:
  group: site-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成站点数据与页面
        run: python build_site.py

      - name: 判断是否有实质变化
        id: check
        run: |
          git show HEAD:data.json > /tmp/remote.json || cp data.json /tmp/remote.json
          if python check_data.py /tmp/remote.json data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 提交更新
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "每日数据更新 $(TZ=Asia/Shanghai date '+%Y-%m-%d')"
            git push
          fi

      - name: 无变化说明
        if: steps.check.outputs.changed != 'true'
        run: echo "数据与线上一致，跳过提交（幂等）"