name: 站点数据每日更新

on:
  schedule:
    # GitHub 免费版 schedule 为 best-effort：实测延迟 3~9 小时，甚至整日跳过（11-20 全天未触发）。
    # 对策不是赌单次准点，而是当日铺满多个时段：任意一次跑成功即完成，其余靠幂等秒退。
    # 全部使用冷门分钟数，避开整点/半点的全局调度拥堵高峰。
    # 以下为 UTC，对应北京时间：
    #   08:37 -> 16:37   10:19 -> 18:19   11:53 -> 19:53
    #   13:31 -> 21:31   14:47 -> 22:47   15:53 -> 23:53
    - cron: '37 8 * * *'
    - cron: '19 10 * * *'
    - cron: '53 11 * * *'
    - cron: '31 13 * * *'
    - cron: '47 14 * * *'
    - cron: '53 15 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [daily-update]

permissions:
  contents: write

concurrency:
  group: site-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成站点数据与页面
        run: python build_site.py

      - name: 判断是否有实质变化
        id: check
        run: |
          git show HEAD:data.json > /tmp/remote.json || cp data.json /tmp/remote.json
          if python check_data.py /tmp/remote.json data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 提交更新
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "每日数据更新 $(TZ=Asia/Shanghai date '+%Y-%m-%d')"
            git push
          fi

      - name: 无变化说明
        if: steps.check.outputs.changed != 'true'
        run: echo "数据与线上一致，跳过提交（幂等）"